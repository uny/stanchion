[package]
name = "stanchion"
description = "An agentic coding GUI for OpenAI-compatible gateways"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
# The binary is a thin wrapper, so the shell stays linkable from integration tests. macOS is
# the only target, so no staticlib/cdylib output for mobile is built here.
name = "stanchion_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
stanchion-core = { path = "../crates/core" }
# For the event mirror the WebView receives (`events`). The core links no serialisation
# library; the shell may, since it is the IPC boundary and nothing it serialises is a
# token.
serde = { version = "1", features = ["derive"] }
# The consent presenter (`presenter`) drives `NSAlert` itself. Pinned to the versions Tauri
# already links, so the graph holds one copy of each; macOS is the only target.
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSAlert",
    "NSApplication",
    "NSButton",
    "NSControl",
    "NSResponder",
    "NSScreen",
    "NSView",
    "NSWindow",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "CFRunLoop",
    "CFString",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "NSArray",
    "NSEnumerator",
    "NSGeometry",
    "NSNotification",
    "NSOperation",
    "NSObject",
    "NSString",
] }
