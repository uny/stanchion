[package]
name = "stanchion-core"
description = "The credential lifecycle, transport and agent loop, independent of any frontend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# `tauri` must never appear here, and neither may anything that implies a WebView. See the
# crate docs. CI enforces the `tauri` half of that: `.github/workflows/build.yml` fails the
# build if `cargo tree` finds the edge under any target or feature combination.
# Dev-dependencies are outside that check; everything below this line is inside it.
[dependencies]
# Content and prior-file hashes bound into a consent token (`consent::request`). A
# non-cryptographic hash would let a write be substituted for one with a colliding digest.
sha2 = "0.10"
# Stopping and killing the process tree under a supervised CLI (`backend::claude_code::tree`):
# `proc_listallpids`, `proc_pidinfo` and `killpg`, which `std` does not expose.
libc = "0.2"
