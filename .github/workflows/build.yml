name: build

on: [push, pull_request]

permissions:
  contents: read

# Supersede a branch's own in-flight runs. The push and pull_request runs of the same
# commit land in different groups and both still run; issue #2 asks for a green build on a
# push, so the trigger set stays as it is.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      - name: Typecheck and build the frontend
        run: pnpm build

      # Cargo runs from the workspace root so that crates/core is covered too, not just
      # the Tauri shell. --workspace is explicit rather than implied by the root manifest.
      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint the workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # The reason the workspace exists. Splitting the crates makes the absent `tauri` edge
      # visible; only this step makes it checked. Without it a `tauri` line added to
      # `crates/core/Cargo.toml` passes every other gate here, and the boundary
      # `docs/architecture.md` describes is gone with a green build.
      #
      # `--target all` and `--all-features` are what make the check hard to walk around: the
      # default host-target, default-feature graph omits a `cfg(windows)`-gated dependency
      # and an unactivated optional one, both of which are still declarations of the edge.
      # `-e normal,build` leaves dev-dependencies out on purpose — the ban is on what the
      # core links, not on what its own tests may reach for.
      - name: Assert the core does not depend on Tauri
        run: |
          cargo tree --locked -p stanchion-core -e normal,build \
            --target all --all-features --prefix none > "$RUNNER_TEMP/core-deps.txt"
          if grep -qE '^tauri' "$RUNNER_TEMP/core-deps.txt"; then
            echo "::error::crates/core has gained a Tauri dependency; see crates/core/src/lib.rs"
            cat "$RUNNER_TEMP/core-deps.txt"
            exit 1
          fi

      # --all-targets above compiles test targets but never runs them. This runs the
      # consent gate's runtime suite (crates/core/tests/consent.rs), the `compile_fail`
      # doctests in crates/core/src/lib.rs that pin the token's type-level guarantees, and
      # the shell's capability and button-order checks (src-tauri/src/presenter.rs).
      - name: Test the workspace
        run: cargo test --locked --workspace

      - name: Build the application
        run: pnpm tauri build --no-bundle
